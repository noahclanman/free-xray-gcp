name: Update GCP V2Ray configs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay cron; that's normal)
  workflow_dispatch:          # manual "Run workflow" button
  push:
    paths:
      - "sources.txt"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xray (used for the real proxy test)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p "$RUNNER_TEMP/xray"
          unzip -q -o "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          "$RUNNER_TEMP/xray/xray" version

      - name: Build GCP-only list (real proxy test)
        run: python scripts/update.py
        env:
          PROTOCOLS: "vmess,vless,trojan,ss"
          MAX_OUTPUT: "1000"
          REPO: ${{ github.repository }}
          BRAND: "@noahclanman"
          XRAY_BIN: ${{ runner.temp }}/xray/xray
          TEST_WORKERS: "16"
          MAX_TEST_MINUTES: "20"
          TEST_TIMEOUT: "7"
          TCP_TIMEOUT: "1.5"
          FAST_MS: "400"
          MAX_MS: "4000"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -q
            git push
          fi
