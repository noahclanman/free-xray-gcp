name: Update GCP V2Ray configs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay cron; that's normal)
  workflow_dispatch:          # manual "Run workflow" button
  push:
    paths:
      - "sources.txt"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build GCP-only list
        run: python scripts/update.py
        env:
          PROTOCOLS: "vmess,vless"   # add trojan,ss if you want them too
          MAX_OUTPUT: "500"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -q
            git push
          fi
